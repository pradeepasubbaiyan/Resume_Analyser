version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verityhire
      POSTGRES_USER: verityhire
      POSTGRES_PASSWORD: verityhire
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://verityhire:verityhire@postgres:5432/verityhire
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
