services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verityhire}
      POSTGRES_USER: ${POSTGRES_USER:-verityhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verityhire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verityhire}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      ALLOWED_ORIGINS: http://127.0.0.1:5175,http://localhost:5175
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
